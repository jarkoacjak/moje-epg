name: Aktualizácia EPG (.xml.gz)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kontrola repozitara
      uses: actions/checkout@v4

    - name: Stiahnutie slovenskeho EPG
      run: |
        # Stiahnutie stabilneho zdrojoveho xml pre SK stanice
        curl -L "https://github.io" -o epg.xml

    - name: Kompresia do .xml.gz
      run: |
        gzip -f -k epg.xml

    - name: Odoslanie zmien na GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add epg.xml.gz epg.xml
        git commit -m "Aktualizacia EPG dat" || exit 0
        git push

