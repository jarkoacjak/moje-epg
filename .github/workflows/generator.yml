name: Automaticke 24/7 EPG

on:
  schedule:
    - cron: '0 4 * * *' # Spustí sa automaticky každé ráno
  workflow_dispatch: # Tlačidlo na ručné spustenie

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kontrola repozitara
      uses: actions/checkout@v4

    - name: Stiahnutie a filtracia EPG
      run: |
        # Stiahnutie oficiálnych zdrojových dát pre Slovensko
        curl -L "https://github.io" -o sk_full.xml
        
        # Spustenie skriptu, ktorý vytiahne dáta pre tvoje stanice
        echo '<?xml version="1.0" encoding="UTF-8"?><tv>' > epg.xml
        grep -E '<channel id="(MarkizaKlasik.sk|JOJSport.sk|JOJSport2.sk)"' sk_full.xml >> epg.xml || true
        
        # Vytiahnutie programov na najbližšie dni
        python3 -c '
        import sys
        allowed = ["MarkizaKlasik.sk", "JOJSport.sk", "JOJSport2.sk"]
        with open("sk_full.xml", "r", encoding="utf-8") as f:
            in_prog = False
            block = ""
            for line in f:
                if "<programme" in line:
                    in_prog = True
                    block = line
                elif in_prog:
                    block += line
                    if "</programme>" in line:
                        if any(f"channel=\"{ch}\"" in block for ch in allowed):
                            print(block, end="")
                        in_prog = False
        ' >> epg.xml
        
        echo '</tv>' >> epg.xml

    - name: Kompresia do .xml.gz
      run: |
        gzip -f -k epg.xml

    - name: Odoslanie zmien na GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add epg.xml.gz epg.xml
        git commit -m "Automaticka obnova EPG" || exit 0
        git push

